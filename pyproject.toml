[project]
name = "bondi"
version = "0.4.0"
description = "Carry Claude Code skills, memory, config and roles between machines as git-backed profiles."
license = "MIT"
keywords = ["claude", "claude-code", "dotfiles", "skills", "sync"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
bondi = "bondi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
